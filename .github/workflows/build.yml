name: Build MCPACK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mcpack
        run: |
          # Remove git directory to avoid packing it
          rm -rf .git
          rm -rf .github
          # Zip the contents
          zip -r MutePack.mcpack *

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MutePack v1.0.${{ github.run_number }}
          files: MutePack.mcpack
          body: "Silences pistons, chickens, droppers, and optimizes chicken rendering for better FPS."
